# Render Blueprint: bitta web-servis (frontend + backend) va PostgreSQL
# Render → New → Blueprint → shu repozitoriyni tanlang
services:
  - type: web
    name: davoamt-tizim
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --include=dev && npm run build
    startCommand: cd backend && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: davoamt-db
          property: connectionString
      - key: STATIC_DIR
        value: ../frontend/dist
      - key: UPLOAD_DIR
        value: ./uploads
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: TEACHER_USERNAME
        value: nozimjon
      - key: TEACHER_PASSWORD
        sync: false

databases:
  - name: davoamt-db
    plan: free
    databaseName: edu
    user: edu
